[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hipe"
version = "0.1.0"
description = "Shared HIPE main-experiment and ablation implementation"
requires-python = ">=3.10"
dependencies = [
  "numpy<2",
  "torch>=2.8",
  "datasets>=2.19,<5",
  "transformers>=4.56",
  "omegaconf>=2.3",
  "tqdm>=4.67",
]

[project.optional-dependencies]
cuda = ["flash-attn>=2.8"]

[tool.setuptools.packages.find]
include = ["hipe*"]
